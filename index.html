<body>
    <button id="installPwaButton" type="button">
        <i class="fas fa-download"></i> Instal Aplikasi

    <div id="desaStartModal">
        <div class="desa-start-card">
            <img
                class="modal-logo"

            </select>

            </div>

        </div>
    </div>

    <div id="thankYouModal" class="thank-you-modal" hidden>
        <div class="thank-you-card">
            <img class="modal-logo" src="logo/logo-1.png" alt="Lambang TNI Angkatan Darat">
            <h2>Terima Kasih</h2>
            <div id="thankYouMessages" aria-live="polite"></div>
            <button type="button" class="thank-you-button" onclick="closeThankYouApplication()">OK</button>

    <!-- Main Container -->
    <div class="container">
        <div id="printable-area">
            <div class="print-header">
                <div class="header-container">
                    <img
                        class="header-image-full"
                        src="header/header.png"
                        alt="Header aplikasi"
                    >
                    <div id="headerDesaLabel" class="header-desa-label" aria-live="polite"></div>
                </div>
            </div>
            <table id="printable-table"></table>
        </div>
        
        <div class="input-section dashboard-desa-status">
            <div class="mode-description hidden-text">
                Laporan otomatis disimpan ke Google Drive.
            </div>
            
            <div class="previewBox hidden-text" id="previewDesa"></div>

            <div id="loadingKoordinat"><i class="fas fa-spinner fa-spin"></i> Memuat koordinat...</div>
            <button class="refresh-btn" onclick="pickRandomKoordinat()"><i class="fas fa-random"></i> Acak Ulang Koordinat</button>
        </div>
        
        <div class="input-section">
            <div class="file-input-container">
                <input type="text" id="watermarkText" class="watermark-input" placeholder="Judul narasi kegiatan" oninput="updatePreview()">
                <div class="media-date-row">
                    <div class="image-input-group">
                        <label class="file-picker-label" for="gambar">Input gambar</label>
                        <input type="file" id="gambar" accept="image/*" onchange="validateAndPreviewImage()">
                        <div id="fileValidation" class="validation-message"></div>
                    </div>
                    <div class="tanggal-input-kustom" role="button" tabindex="0" onclick="openDatePicker('tanggalTanggal')" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDatePicker('tanggalTanggal'); }">
                        <label class="date-picker-label" for="tanggalTanggal">Tanggal</label>
                        <input type="date" id="tanggalTanggal" lang="id" aria-label="Pilih tanggal" onchange="syncDateTimeInputs()" oninput="syncDateTimeInputs()">
                    </div>
                    <div class="waktu-input-kustom" role="button" tabindex="0" onclick="openDatePicker('tanggalJam')" onkeydown="if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); openDatePicker('tanggalJam'); }">
                        <label class="date-picker-label" for="tanggalJam">Waktu</label>
                        <input type="time" id="tanggalJam" step="1" lang="id" aria-label="Pilih waktu 24 jam" onchange="syncDateTimeInputs()" oninput="syncDateTimeInputs()">
                    </div>
                    <input type="text" id="tanggalWaktuDisplay" value="Pilih tanggal dan waktu" readonly aria-label="Tanggal dan waktu kegiatan">
                    <input type="datetime-local" id="tanggalWaktu" step="1" lang="id" onchange="updateDatePreview()" aria-label="Tanggal dan waktu gabungan">
                </div>
            </div>

            <canvas id="canvas"></canvas>

            <textarea id="narasi" rows="4" placeholder="Isi narasi kegiatan" oninput="autoResizeNarasi(this); checkInputCompletion()"></textarea>

            <div class="action-buttons">
                <button id="submitBtn" class="combined-button" onclick="processSubmission()" disabled>
                    <i class="fas fa-cloud-upload-alt"></i> SIMPAN
                </button>
                <button id="exitBtn" class="exit-button" type="button" onclick="exitApplication()">
                    <i class="fas fa-sign-out-alt"></i> KELUAR
                </button>
            </div>
        </div>
        
    </div>

    <script>
        // ================= KONFIGURASI UTAMA =================
        const LOCAL_DATA_URL = "data/desa/desa dan kelurahan.json";
        const APP_CONFIG_URL = "config/app-config.json";
        
        // ================= KONFIGURASI VALIDASI FOTO =================
        const MAX_FILE_SIZE = 10 * 1024 * 1024; // 10 MB
        const ALLOWED_TYPES = ['image/jpeg', 'image/png', 'image/jpg', 'image/gif', 'image/webp'];
        const MIN_WIDTH = 640;
        const MIN_HEIGHT = 480;
        
        // ================= VARIABEL GLOBAL =================
        let img = new Image();
        let selectedDesa = "";
        let kordinatList = [];
        let currentKoordinat = "";
        let tanggalWaktu = "";
        let lastSubmittedDate = null;
        let submissionCount = 0;
        let submittedDates = [];
        let currentFile = null;
        let fileIsValid = false;
        let lastAutoDateNarration = "";
        // Ucapan penutup hanya menghitung laporan pada sesi aplikasi saat ini.
        let submittedBabinsas = [];
        const DEVICE_TIME_ZONE = Intl.DateTimeFormat().resolvedOptions().timeZone;

        function getDeviceZoneLabel(date = new Date()) {
            const offsetMinutes = -date.getTimezoneOffset();
            if (offsetMinutes === 420) return "WIB";
            if (offsetMinutes === 480) return "WITA";
            if (offsetMinutes === 540) return "WIT";
            return DEVICE_TIME_ZONE || "Waktu perangkat";
        }

        function getIndonesiaDateParts(date = new Date()) {
            const parts = new Intl.DateTimeFormat('en-CA', {
                timeZone: DEVICE_TIME_ZONE,
                year: 'numeric',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                hourCycle: 'h23'
            }).formatToParts(date);
            return Object.fromEntries(parts
                .filter(part => part.type !== 'literal')
                .map(part => [part.type, part.value]));
        }

        function formatIndonesiaDate(date, options) {
            return date.toLocaleString('id-ID', {
                timeZone: DEVICE_TIME_ZONE,
                ...options
            });
        }

        function parseIndonesiaInput(value) {
            return new Date(value);
        }

        function updateStoredFileTicker(fileName) {
            const ticker = document.getElementById("storedFileTicker");
            if (!ticker) return;
            ticker.innerHTML = `<span>ZIP tersimpan di Google Drive: ${fileName}</span>`;
        }

        function getBabinsaIdentity(desaName) {
            const namaWilayah = desaName.replace(/^Kelurahan\s+/i, '').trim();
            return `Babinsa  ${namaWilayah}`;
        }
        
        // ================= VARIABEL CHAT HYBRID =================
        let lastUpdateId = 0;
        let chatConnectionActive = false;
        let unreadMessages = 0;
        let chatHistory = [];
        let ignoredMessageIds = new Set();
        let chatMode = 'bot';
        const POLL_INTERVAL = 3000;
        const CHAT_HISTORY_KEY = 'dukops_chat_history';
        const MAX_CHAT_HISTORY = 100;
        
        // ================= FUNGSI UTAMA CHAT =================
        
        function updateChatDesaBadge() {
            const badge = document.getElementById('currentDesaBadge');
            const userBadge = document.getElementById('userDesaBadge');
            if (!badge || !userBadge) return;
            
            if (selectedDesa) {
                badge.textContent = selectedDesa;
                badge.style.background = 'rgba(76, 175, 80, 0.3)';
                userBadge.textContent = selectedDesa;
                userBadge.style.background = '#2563EB';
            } else {
                badge.textContent = 'Belum Pilih Desa';
                badge.style.background = 'rgba(255, 152, 0, 0.2)';
                userBadge.textContent = 'Belum Pilih Desa';
                userBadge.style.background = '#315A8A';
            }
        }
        
        function setChatMode(mode) {
            chatMode = mode;
            
            // Update UI button states
            document.querySelectorAll('.chat-option-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            
            const activeBtn = document.getElementById(mode + 'ModeBtn');
            if (activeBtn) activeBtn.classList.add('active');
            
            // Show notification
            let modeText = '';
            switch(mode) {
                case 'bot':
                    modeText = 'Mengirim ke Bot Asisten saja';
                    break;
            }
            
            addChatMessage({
                type: 'system',
                text: `Ã°Å¸â€œÂ¡ Mode chat: ${modeText}`,
                timestamp: new Date().toISOString()
            });
            
            // Save preference
            localStorage.setItem('dukops_chat_mode', mode);
        }
        
        function initChatSystem() {
            console.log('Ã°Å¸â€™Â¬ Initializing hybrid chat system...');
            
            // Load chat mode preference
            const savedMode = localStorage.getItem('dukops_chat_mode');
            if (savedMode) {
                setChatMode('bot');
            } else {
                setChatMode('bot');
            }
            
            // Update desa badge
            updateChatDesaBadge();
            
            // Load chat history
            loadChatHistory();
            
            // Setup event listeners
            setupChatEvents();
            
            // Setup chat input auto-focus
            setupChatInputAutoFocus();
            
            // Clean auto-reply
            setTimeout(cleanAutoReplyFromHistory, 1000);
            
            // Start polling
        }
        
        function setupChatEvents() {
            // Chat toggle button
            document.getElementById('chatToggleBtn').onclick = toggleChatWidget;
            
            // Close chat button
            document.getElementById('closeChat').onclick = toggleChatWidget;
            
            // Chat input enter key
            const chatInput = document.getElementById('chatInput');
            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendChatMessage();
                }
            });
        }
        
        function setupChatInputAutoFocus() {
            const chatToggleBtn = document.getElementById('chatToggleBtn');
            const chatWidget = document.getElementById('telegramChatWidget');
            const chatInput = document.getElementById('chatInput');
            
            chatToggleBtn.addEventListener('click', function() {
                setTimeout(() => {
                    if (chatWidget.style.display === 'flex') {
                        chatInput.focus();
                        unreadMessages = 0;
                        updateUnreadCounter();
                    }
                }, 200);
            });
        }
        
        function toggleChatWidget() {
            const widget = document.getElementById('telegramChatWidget');
            const toggleBtn = document.getElementById('chatToggleBtn');
            
            if (widget.style.display === 'flex') {
                widget.style.display = 'none';
                toggleBtn.innerHTML = '<i class="fas fa-comment-alt"></i>';
                if (unreadMessages > 0) {
                    toggleBtn.querySelector('.badge').style.display = 'flex';
                }
            } else {
                widget.style.display = 'flex';
                toggleBtn.innerHTML = '<i class="fas fa-times"></i>';
                
                unreadMessages = 0;
                updateUnreadCounter();
                
                setTimeout(() => {
                    const messagesContainer = document.getElementById('chatMessages');
                    if (messagesContainer.children.length > 0) {
                        messagesContainer.scrollTop = messagesContainer.scrollHeight;
                    }
                }, 100);
                
                setTimeout(() => {
                    document.getElementById('chatInput').focus();
                }, 150);
            }
        }
        
        function startTelegramPolling() {
            chatConnectionActive = true;
            
            pollTelegramMessages();
            
            const pollInterval = setInterval(() => {
                if (chatConnectionActive) {
                    pollTelegramMessages();
                } else {
                    clearInterval(pollInterval);
                }
            }, POLL_INTERVAL);
        }
        
        async function pollTelegramMessages() {
            try {
                const response = await fetch(
                    `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=2`
                );
                
                if (response.ok) {
                    const data = await response.json();
                    
                    if (data.ok && data.result.length > 0) {
                        lastUpdateId = data.result[data.result.length - 1].update_id;
                        
                        data.result.forEach(update => {
                            if (update.message && update.message.text) {
                                const msg = update.message;
                                const msgId = msg.message_id;
                                const msgText = msg.text;
                                const senderName = msg.from?.first_name || '';
                                const senderId = msg.from?.id;
                                
                                if (ignoredMessageIds.has(msgId)) return;
                                
                                // FILTER AUTO-REPLY
                                const isAutoReply = 
                                    msgText.includes('BOT INPUT BABINSA') ||
                                    msgText.includes('Terima kasih. Silakan isi form') ||
                                    msgText.includes('Noted. Untuk bantuan ketik') ||
                                    msgText.includes('Pesan tercatat. Lanjutkan') ||
                                    msgText.includes('Dapat pesan dari') ||
                                    msgText.includes('Pesan diterima. Form DUKOPS aktif') ||
                                    msgText.includes('Terima kasih pesannya') ||
                                    /^BOT INPUT/.test(msgText) ||
                                    /^Terima kasih\./.test(msgText) ||
                                    /^Noted\./.test(msgText);
                                
                                const isFromBot = msg.from?.is_bot || senderName.includes('BOT');
                                
                                if (isAutoReply || isFromBot) {
                                    ignoredMessageIds.add(msgId);
                                    console.log('Ã°Å¸â€â€¡ Ignored auto-reply');
                                    return;
                                }
                                
                                // Tampilkan semua pesan dari MangSatria79
                                processIncomingMessage(msg);
                            }
                        });
                        
                        updateChatStatus('connected');
                        updateChannelStatus(true);
                    }
                }
            } catch (error) {
                updateChatStatus('disconnected');
                updateChannelStatus(false);
            }
        }
        
        function cleanAutoReplyFromHistory() {
            const messages = document.querySelectorAll('#chatMessages .chat-message');
            messages.forEach(msg => {
                const textEl = msg.querySelector('.message-text');
                if (textEl) {
                    const text = textEl.textContent;
                    if (text.includes('BOT INPUT') || 
                        text.includes('Terima kasih. Silakan') ||
                        text.includes('Noted. Untuk bantuan')) {
                        msg.remove();
                    }
                }
            });
        }
        
        function processIncomingMessage(message) {
            if (message.from.is_bot) return;
            
            const messageText = message.text;
            const senderName = message.from.first_name || 'User';
            const senderId = message.from.id;
            const chatId = message.chat.id;
            
            let senderDisplay = senderName;
            
            // Tampilkan di chat
            addChatMessage({
                type: 'incoming',
                text: messageText,
                sender: senderDisplay,
                timestamp: new Date(message.date * 1000).toISOString()
            });
            
            // Unread counter
            if (document.getElementById('telegramChatWidget').style.display !== 'flex') {
                unreadMessages++;
                updateUnreadCounter();
            }
            
            // Handle command dari pengguna yang diizinkan
            if (senderId == TELEGRAM_CHAT_ID) {
                handleIncomingCommand(messageText, senderName, chatId);
            }
            
            saveChatHistory();
        }
        
        function handleIncomingCommand(message, sender, chatId) {
            const lowerMsg = message.toLowerCase().trim();
            
            if (lowerMsg === 'reset' && chatId == TELEGRAM_CHAT_ID) {
                resetForm();
                sendTelegramReply(chatId, 'Ã¢Å“â€¦ Form telah direset.');
            }
            
            // Auto-reply untuk pesan tertentu
            if (lowerMsg === 'status') {
                sendTelegramReply(chatId, `Ã°Å¸â€œÅ  Status Form: ${getFormStatus()}\nÃ°Å¸â€œË† Total: ${submissionCount} laporan`);
            }
        }
        
        async function sendChatMessage() {
            const input = document.getElementById('chatInput');
            if (!input || !input.value.trim()) return;
            
            const message = input.value.trim();
            const timestamp = new Date().toISOString();
            
            // Jika belum pilih desa, warning
            if (!selectedDesa) {
                addChatMessage({
                    type: 'error',
                    text: 'Ã¢ÂÅ’ Silakan pilih desa/kelurahan terlebih dahulu!',
                    timestamp: timestamp
                });
                return;
            }
            
            // Tampilkan di chat UI sebagai outgoing DENGAN NAMA DESA
            addChatMessage({
                type: 'outgoing',
                text: message,
                sender: `Anda (Babinsa ${selectedDesa})`,
                timestamp: timestamp
            });
            
            // Reset input
            input.value = '';
            input.style.height = '45px';
            
            // Kirim berdasarkan mode dengan IDENTITAS DESA
            try {
                let promises = [];
                let modeText = '';
                
                // Format pesan dengan identitas desa
                const simpleMessage = `Babinsa ${selectedDesa}: ${message}`;
                
                promises.push(
                    fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: simpleMessage,
                            parse_mode: 'Markdown'
                        })
                    })
                );
                modeText = 'Bot ';
                
                // Tunggu semua kiriman selesai
                const results = await Promise.allSettled(promises);
                
                // Cek hasil
                const successCount = results.filter(r => r.status === 'fulfilled' && r.value.ok).length;
                
                if (successCount === 0) {
                    addChatMessage({
                        type: 'error',
                        text: 'Ã¢ÂÅ’ Gagal mengirim pesan',
                        timestamp: new Date().toISOString()
                    });
                } else {
                    // Tampilkan info pengiriman berhasil
                    addChatMessage({
                        type: 'system',
                        text: `Ã¢Å“â€¦ Pesan terkirim ke: ${modeText.trim()}\nÃ°Å¸â€œâ€¹ Identitas: Babinsa ${selectedDesa}`,
                        timestamp: new Date().toISOString()
                    });
                }
                
            } catch (error) {
                addChatMessage({
                    type: 'error',
                    text: 'Ã¢Å¡Â Ã¯Â¸Â Koneksi error. Periksa internet Anda.',
                    timestamp: new Date().toISOString()
                });
            }
            
            saveChatHistory();
        }
        
        async function sendTelegramReply(chatId, message) {
            try {
                await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: chatId,
                        text: message
                    })
                });
            } catch (error) {
                console.log('Failed to send reply');
            }
        }
        
        function addChatMessage(messageData) {
            const messagesContainer = document.getElementById('chatMessages');
            if (!messagesContainer) return;
            
            const messageElement = document.createElement('div');
            
            let messageClass = '';
            switch(messageData.type) {
                case 'outgoing': messageClass = 'message-outgoing'; break;
                case 'incoming': messageClass = 'message-incoming'; break;
                case 'system': messageClass = 'message-system'; break;
                case 'error': messageClass = 'message-error'; break;
                case 'info': messageClass = 'message-info'; break;
            }
            
            const time = new Date(messageData.timestamp).toLocaleTimeString('id-ID', {
                hour: '2-digit',
                minute: '2-digit'
            });
            
            // Tambahkan badge desa untuk pesan outgoing
            let senderHtml = '';
            if (messageData.sender) {
                if (messageData.type === 'outgoing' && selectedDesa) {
                    senderHtml = `<div class="message-sender">
                        ${messageData.sender}
                        <span class="sender-badge">${selectedDesa}</span>
                    </div>`;
                } else {
                    senderHtml = `<div class="message-sender">${messageData.sender}</div>`;
                }
            }
            
            messageElement.className = `chat-message ${messageClass}`;
            messageElement.innerHTML = `
                ${senderHtml}
                <div class="message-text">${messageData.text}</div>
                <div class="message-time">${time}</div>
            `;
            
            messagesContainer.appendChild(messageElement);
            
            setTimeout(() => {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, 50);
            
            chatHistory.push({
                ...messageData,
                id: Date.now()
            });
            
            if (chatHistory.length > MAX_CHAT_HISTORY) {
                chatHistory = chatHistory.slice(-MAX_CHAT_HISTORY);
            }
        }
        
        function loadChatHistory() {
            try {
                const saved = localStorage.getItem(CHAT_HISTORY_KEY);
                if (saved) {
                    chatHistory = JSON.parse(saved);
                    const recentMessages = chatHistory.slice(-10);
                    recentMessages.forEach(msg => {
                        addChatMessage(msg);
                    });
                }
            } catch (error) {
                console.log('Error loading chat history');
            }
        }
        
        function saveChatHistory() {
            try {
                localStorage.setItem(CHAT_HISTORY_KEY, JSON.stringify(chatHistory));
            } catch (error) {
                console.log('Error saving chat history');
            }
        }
        
        function updateUnreadCounter() {
            const badge = document.getElementById('unreadCount');
            if (badge) {
                if (unreadMessages > 0) {
                    badge.textContent = unreadMessages > 9 ? '9+' : unreadMessages;
                    badge.style.display = 'flex';
                } else {
                    badge.style.display = 'none';
                }
            }
        }
        
        function updateChatStatus(status) {
            const statusElement = document.getElementById('chatStatus');
            if (!statusElement) return;
            
            switch(status) {
                case 'connected':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon connected"></i> Terhubung ke Bot Asisten`;
                    break;
                case 'disconnected':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon disconnected"></i> Offline`;
                    break;
                case 'connecting':
                    statusElement.innerHTML = `<i class="fas fa-circle status-icon connecting"></i> Menghubungkan...`;
                    break;
            }
        }
        
        // ================= FUNGSI VALIDASI FOTO =================
        
        function validateAndPreviewImage() {
            const fileInput = document.getElementById("gambar");
            const validationMsg = document.getElementById("fileValidation");
            
            // Reset state
            validationMsg.className = "validation-message";
            validationMsg.textContent = "";
            fileIsValid = false;
            document.getElementById("canvas").style.display = "none";
            img = new Image();
            
            if (!fileInput.files || fileInput.files.length === 0) {
                validationMsg.className = "validation-message validation-warning";
                validationMsg.textContent = "Ã¢Å¡Â Ã¯Â¸Â Silakan pilih file gambar";
                return;
            }
            
            currentFile = fileInput.files[0];
            
            // Validasi 1: Tipe file
            if (!ALLOWED_TYPES.includes(currentFile.type)) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `Ã¢ÂÅ’ Format file tidak didukung. Gunakan: JPEG, PNG, GIF, WebP`;
                fileInput.value = "";
                return;
            }
            
            // Validasi 2: Ukuran file
            if (currentFile.size > MAX_FILE_SIZE) {
                validationMsg.className = "validation-message validation-error";
                validationMsg.textContent = `Ã¢ÂÅ’ File terlalu besar (${formatFileSize(currentFile.size)}). Maksimal: ${formatFileSize(MAX_FILE_SIZE)}`;
                fileInput.value = "";
                return;
            }
            
            // Preview gambar
            const reader = new FileReader();
            reader.onload = function(e) {
                img = new Image();
                img.src = e.target.result;
                
                img.onload = function() {
                    // Validasi 3: Dimensi gambar
                    const width = img.width;

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

            if (tglInput) {

                    date = parseIndonesiaInput(tglInput);
                } else {
                    const [datePart, timePart] = tglInput.split(' ');
                    const [year, month, day] = datePart.split('-');
                    const [hours, minutes] = timePart.split(':');
                    date = new Date(year, month - 1, day, hours, minutes);
                }
                
                const inputTime = tglInput.split('T')[1] || '';
                const inputSeconds = inputTime.split(':')[2];
                date.setSeconds(inputSeconds ? Number(inputSeconds) : new Date().getSeconds());

                    hour: '2-digit', 
                    minute: '2-digit', 
                    second: '2-digit',

                    hourCycle: 'h23'

        function updateDateDisplayMarquee(text) {
            const wrapper = document.querySelector(".date-display-wrapper");

            if (!wrapper || !marquee) return;
            marquee.textContent = text;
            marquee.classList.remove("is-running");
            marquee.style.fontSize = "";
            const maxFontSize = 19;
            const minFontSize = 11;
            let fontSize = maxFontSize;
            while (fontSize > minFontSize && marquee.scrollWidth > wrapper.clientWidth) {
                fontSize -= 1;
                marquee.style.fontSize = `${fontSize}px`;
            }
        }

        function updatePreview() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            const watermarkInput = document.getElementById("watermarkText");
            const canvasWidth = 800;
            const canvasHeight = 600;

            canvas.width = canvasWidth;
            canvas.height = canvasHeight;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (img.src && img.complete) {
                const imageRatio = img.width / img.height;
                const canvasRatio = canvasWidth / canvasHeight;
                let sourceWidth = img.width;
                let sourceHeight = img.height;
                let sourceX = 0;
                let sourceY = 0;

                if (imageRatio > canvasRatio) {
                    sourceWidth = img.height * canvasRatio;
                    sourceX = (img.width - sourceWidth) / 2;
                } else {
                    sourceHeight = img.width / canvasRatio;
                    sourceY = (img.height - sourceHeight) / 2;
                }

                ctx.drawImage(
                    img,
                    sourceX,
                    sourceY,
                    sourceWidth,
                    sourceHeight,
                    0,
                    0,
                    canvasWidth,
                    canvasHeight
                );
            } else {
                ctx.fillStyle = "#000";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            const watermarkText = watermarkInput && watermarkInput.value.trim()
                ? watermarkInput.value.trim()
                : (selectedDesa ? `Babinsa ${selectedDesa}` : "Babinsa");

            if (watermarkText || currentKoordinat || tanggalWaktu) {
                ctx.textAlign = "right";
                ctx.font = "36px Arial";
                ctx.fillStyle = "white";
                ctx.strokeStyle = "rgba(0, 0, 0, 0.85)";
                ctx.lineWidth = 4;
                ctx.lineJoin = "round";
                
                const bottomMargin = 20;
                const lineHeight = 40;
                const rightMargin = 10;
                
                if (watermarkText) {
                    ctx.strokeText(watermarkText,
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - (lineHeight * 2));
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(watermarkText,
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - (lineHeight * 2));
                }
                
                if (currentKoordinat) {
                    ctx.strokeText(currentKoordinat, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin - lineHeight);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(currentKoordinat, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin - lineHeight);
                }
                
                if (tanggalWaktu) {
                    const date = new Date(tanggalWaktu);
                    let dateText;
                    
                    if (date.toLocaleDateString) {
                        const watermarkSeconds = String(date.getSeconds()).padStart(2, "0");
                        dateText = formatIndonesiaDate(date, { 
                            day: "2-digit", 
                            month: "long", 
                            year: "numeric" 
                        }) + ", " + 
                        formatIndonesiaDate(date, { 
                            hour: "2-digit", 
                            minute: "2-digit", 
                            hour12: false,
                            hourCycle: "h23"
                        }).replace(":", ".") + `.${watermarkSeconds}`;
                    }
                    
                    ctx.strokeText(dateText, 
                                  canvas.width - rightMargin, 
                                  canvas.height - bottomMargin);
                    
                    ctx.fillStyle = "white";
                    ctx.fillText(dateText, 
                                canvas.width - rightMargin, 
                                canvas.height - bottomMargin);
                }
            }
        }

                .replace(/-+/g, "-") || "laporan";

        function canvasToBlob(canvas) {
            return new Promise((resolve, reject) => {
                canvas.toBlob(blob => {
                    if (blob) {
                        resolve(blob);
                    } else {
                        reject(new Error("Gagal membuat gambar laporan"));
                    }
                }, "image/png");
            });
        }

        function downloadBlob(blob, fileName) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.href = url;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
        }

        async function createSubmissionFiles() {
            const canvas = document.getElementById("canvas");
            const baseName = getSubmissionBaseName();
            const imageBlob = await canvasToBlob(canvas);
            const reportText = buildSubmissionNarrative();
            const textBlob = new Blob([reportText], { type: "text/plain;charset=utf-8" });
            return { baseName, imageBlob, textBlob, reportText };
        }

        async function downloadSubmissionFiles(submission) {
            downloadBlob(submission.imageBlob, `${submission.baseName}.png`);
            downloadBlob(submission.textBlob, `${submission.baseName}.txt`);
        }

        async function createSubmissionZip(submission) {
            if (typeof JSZip === "undefined") {
                throw new Error("Modul ZIP belum tersedia. Periksa koneksi lalu muat ulang halaman.");
            }

            const zip = new JSZip();
            zip.file(`${submission.baseName}.png`, submission.imageBlob);
            zip.file(`${submission.baseName}.txt`, submission.reportText);
            const zipBlob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
            return { zipBlob, baseName: submission.baseName };
        }

        async function processSubmission() {
            const submitButton = document.getElementById("submitBtn");
            if (submitButton.dataset.processing === "true") return;
            if (!selectedDesa || !currentKoordinat || !fileIsValid || !tanggalWaktu) {
                checkInputCompletion();
                return;
            }

            if (isDuplicateSubmission()) {
                showNotification(`Laporan sudah dikirim pada tanggal yang sama: ${formatSubmissionDate(tanggalWaktu)}. Pengiriman dibatalkan.`, "duplicate");
                return;
            }

            submitButton.dataset.processing = "true";
            submitButton.disabled = true;
            submitButton.classList.add("is-processing");
            const originalButtonText = submitButton.innerHTML;
            submitButton.innerHTML = `<i class="fas fa-spinner fa-spin"></i> ${selectedDesa}`;
            try {
                const files = await createSubmissionFiles();
                await downloadSubmissionFiles(files);
                let driveUploaded = false;
                try {
                    const submission = await createSubmissionZip(files);
                    driveUploaded = await window.uploadToGoogleDrive(
                        submission.zipBlob,
                        `${submission.baseName}.zip`,
                        selectedDesa,
                        new Date(tanggalWaktu)
                    );
                    if (driveUploaded) {
                        updateStoredFileTicker(`${submission.baseName}.zip`);
                    }
                } catch (uploadError) {
                    console.error("Upload Google Drive gagal:", uploadError);
                }
                updateCounter();
                saveSubmittedDate(tanggalWaktu);
                addSendLog(`${files.baseName}.png dan ${files.baseName}.txt`, "success");
                submittedBabinsas.push({ desa: selectedDesa, date: tanggalWaktu });
            } catch (error) {
                console.error("Gagal membuat file laporan:", error);
                addSendLog(`${getSubmissionBaseName()}.png dan ${getSubmissionBaseName()}.txt`, "failed", error.message);
            } finally {
                submitButton.disabled = false;
                submitButton.dataset.processing = "false";
                submitButton.classList.remove("is-processing");
                submitButton.innerHTML = originalButtonText;
                checkInputCompletion();
            }
        }

        async function loadAppConfig() {
            let response;
            try {
                response = await fetch(APP_CONFIG_URL, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }

            } catch (error) {
                if (window.location.protocol !== "file:") {
                    throw error;
                }
                const localUrl = new URL(APP_CONFIG_URL, window.location.href).href;
                response = await fetch(localUrl, { cache: "no-store" });
                if (!response.ok) {
                    throw new Error(`Gagal memuat konfigurasi aplikasi (HTTP ${response.status})`);
                }
            }

            const config = await response.json();
            const appName = typeof config.appName === "string" ? config.appName.trim() : "";
            const headerTitle = typeof config.headerTitle === "string" && config.headerTitle.trim()
                ? config.headerTitle.trim()
                : appName;
            const fields = [
                ["headerTitle", headerTitle],
                ["headerUnit", config.headerUnit],
                ["headerAddress", config.headerAddress ?? ""]
            ];
            fields.forEach(([id, value]) => {
                const text = typeof value === "string" ? value.trim() : "";
                if ((id === "headerTitle" || id === "headerUnit") && !text) {
                    throw new Error(`Konfigurasi ${id} tidak valid`);
                }
                const element = document.getElementById(id);
                if (element) {
                    element.textContent = text;
                }
            });
            document.title = `${appName || headerTitle} - Sistem Pelaporan`;
            document.querySelector('meta[name="description"]')?.setAttribute(
                "content",
                config.description || "Sistem pelaporan kegiatan."
            );
            updateInstallManifest(config);
        }

        function populateDesaOptions(desaFiles, select) {

                const desaName = fileName
                    .replace(/\.txt$/i, '')
                    .replace(/[_-]+/g, ' ')
                    .trim();
                const wilayahType = /^(desa|kelurahan)\b/i.test(desaName)
                    ? desaName.match(/^(desa|kelurahan)\b/i)[1]
                    : 'Desa';
                const wilayahName = desaName.replace(/^(desa|kelurahan)\s+/i, '').trim();
                const option = document.createElement('option');
                option.value = `data/desa/${fileName}`;
                option.textContent = `${index + 1}. ${wilayahType} ${wilayahName}`;
                option.style.color = wilayahType.toLowerCase() === 'kelurahan'
                    ? '#315A8A'
                    : '#172033';
                select.appendChild(option);
            });
        }

        function resetForm() {
            selectedDesa = "";
            kordinatList = [];
            currentKoordinat = "";
            document.getElementById('selectDesa').value = "";
            const selectedDesaLabel = document.getElementById('selectedDesaLabel');
            if (selectedDesaLabel) {
                selectedDesaLabel.textContent = "";
            }
            document.getElementById('previewDesa').textContent = "";
            document.getElementById('watermarkText').value = "";
            document.getElementById('narasi').value = "";
            document.getElementById('gambar').value = "";
            document.getElementById('tanggalWaktu').value = "";
            document.getElementById('tanggalTanggal').value = "";
            document.getElementById('tanggalJam').value = "";
            document.querySelector('label[for="tanggalTanggal"]').textContent = "Tanggal";
            document.querySelector('label[for="tanggalJam"]').textContent = "Waktu";
            document.getElementById('previewTanggal').textContent = "";
            
            // Reset validasi foto
            document.getElementById('fileValidation').className = "validation-message";
            document.getElementById('fileValidation').textContent = "";
            fileIsValid = false;
            currentFile = null;
            
            // Reset chat badge
            updateChatDesaBadge();
            
            // Tambahkan notifikasi di chat
            addChatMessage({
                type: 'system',
                text: 'Ã°Å¸â€â€ž Form telah direset. Silakan pilih desa/kelurahan kembali.',
                timestamp: new Date().toISOString()
            });
            
            updateDesaHeaderImage("");
            checkInputCompletion();
            updatePreview();
            resetCanvas();
        }
        
        function checkInputCompletion() {
            const isComplete = selectedDesa && 
                             currentKoordinat && 
                             tanggalWaktu && 
                             fileIsValid && 
                             img.src && 
                             img.complete && 
                             document.getElementById("narasi").value.trim().length >= 10;
            
            document.getElementById("submitBtn").disabled = !isComplete;
        }
        
        function showNotification(message, type) {
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            notification.textContent = message;
            notification.setAttribute('role', 'button');
            notification.setAttribute('tabindex', '0');
            notification.setAttribute('aria-label', 'Tutup notifikasi');

            document.body.appendChild(notification);

            const closeNotification = () => {
                notification.style.opacity = '0';
                setTimeout(() => notification.remove(), 500);
            };
            notification.addEventListener('click', closeNotification, { once: true });
            notification.addEventListener('keydown', event => {
                if (event.key === 'Enter' || event.key === ' ') {
                    event.preventDefault();
                    closeNotification();
                }
            }, { once: true });
        }
        
        function getFormStatus() {
            const desa = selectedDesa ? 'Ã¢Å“â€¦ Desa terpilih' : 'Ã¢ÂÅ’ Belum pilih desa';
            const gambar = fileIsValid ? 'Ã¢Å“â€¦ Gambar valid' : 'Ã¢ÂÅ’ Gambar belum valid';
            const narasi = document.getElementById('narasi').value ? 'Ã¢Å“â€¦ Narasi diisi' : 'Ã¢ÂÅ’ Belum narasi';
            
            return `${desa}, ${gambar}, ${narasi}`;
        }

        // ================= FUNGSI BANTUAN =================
        
        function initializeCounter() {
            const savedCount = localStorage.getItem('dukopsSubmissionCount');
            submissionCount = savedCount ? parseInt(savedCount) : 0;
            loadSendLogs();
        }

        function updateCounter() {
            submissionCount++;
            localStorage.setItem('dukopsSubmissionCount', submissionCount.toString());
        }

        function addSendLog(filename, status, message = "") {
            const logsContainer = document.getElementById("logTerkirim");
            if (!logsContainer) {
                saveSendLog(filename, status, new Date().toLocaleTimeString('id-ID'));
                return;
            }
            const logEntry = document.createElement("div");
            logEntry.className = "log-entry";
            
            const time = new Date().toLocaleTimeString('id-ID');
            const statusClass = status === "success" ? "success" : "failed";
            
            logEntry.innerHTML = `
                <div class="log-time">${time}</div>
                <div class="log-filename">${filename}</div>
                <div class="log-status ${statusClass}">${status.toUpperCase()}</div>
            `;
            
            logsContainer.insertBefore(logEntry, logsContainer.firstChild);
            saveSendLog(filename, status, time);
        }

        function saveSendLog(filename, status, time) {
            let logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            logs.unshift({ filename, status, time });
            if (logs.length > 50) logs = logs.slice(0, 50);
            localStorage.setItem('dukopsSendLogs', JSON.stringify(logs));
        }

        function loadSendLogs() {
            const logs = JSON.parse(localStorage.getItem('dukopsSendLogs') || '[]');
            const container = document.getElementById("logTerkirim");
            if (!container) return;
            
            logs.forEach(log => {
                const logEntry = document.createElement("div");
                logEntry.className = "log-entry";
                const statusClass = log.status === "success" ? "success" : "failed";
                
                logEntry.innerHTML = `
                    <div class="log-time">${log.time}</div>
                    <div class="log-filename">${log.filename}</div>
                    <div class="log-status ${statusClass}">${log.status.toUpperCase()}</div>
                `;
                
                container.appendChild(logEntry);
            });
        }

        function saveSubmittedDate(dateStr) {
            submittedDates.push({
                desa: selectedDesa,
                date: dateStr,
                dateKey: getSubmissionDateKey(dateStr)
            });
            localStorage.setItem('dukopsSubmittedDates', JSON.stringify(submittedDates));
        }

        function getSubmissionDateKey(dateStr) {
            const value = String(dateStr || "");
            return value.includes("T") ? value.split("T")[0] : value;
        }

        function formatSubmissionDate(dateStr) {
            const dateKey = getSubmissionDateKey(dateStr);
            const parts = dateKey.split("-");
            if (parts.length !== 3) return dateKey;
            return new Date(`${dateKey}T00:00:00`).toLocaleDateString("id-ID", {
                day: "numeric",
                month: "long",
                year: "numeric"
            });
        }

        function isDuplicateSubmission() {
            const currentDateKey = getSubmissionDateKey(tanggalWaktu);
            return submittedDates.some(entry => {
                if (!entry || typeof entry !== "object" || !entry.desa || !entry.date) return false;
                const savedDateKey = entry.dateKey || getSubmissionDateKey(entry.date);
                return entry.desa === selectedDesa && savedDateKey === currentDateKey;
            });
        }

        function loadLastSubmittedDates() {
            const savedDates = localStorage.getItem('dukopsSubmittedDates');
            submittedDates = savedDates ? JSON.parse(savedDates) : [];
        }

        function resetCanvas() {
            const canvas = document.getElementById("canvas");
            const ctx = canvas.getContext("2d");
            canvas.style.display = "none";
            canvas.width = 800;
            canvas.height = Math.round(canvas.width / (16/9));
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function resetAll() {
            if (confirm("Reset semua data?")) {
                submissionCount = 0;
                localStorage.setItem('dukopsSubmissionCount', '0');
                
                localStorage.removeItem('dukopsSendLogs');
                const logsContainer = document.getElementById('logTerkirim');
                if (logsContainer) logsContainer.innerHTML = '';
                
                submittedDates = [];
                localStorage.removeItem('dukopsSubmittedDates');
                
                resetForm();
                
                showNotification("Ã¢Å“â€¦ Data berhasil direset", "success");
            }
        }

        // ================= EVENT LISTENERS =================
        
        document.addEventListener('visibilitychange', function() {
            if (!document.hidden && chatConnectionActive) {
                updateChatStatus('connected');
            }
        });
        
        window.addEventListener('beforeunload', function() {
            chatConnectionActive = false;
            saveChatHistory();
        });

        // Start when page is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initialize);
        } else {
            initialize();
        }

        let deferredInstallPrompt = null;

        function isPwaInstalled() {
            return window.matchMedia('(display-mode: standalone)').matches ||
                window.navigator.standalone === true ||
                document.referrer.startsWith('android-app://');
        }

        function updateInstallButton() {
            const button = document.getElementById('installPwaButton');
            if (!button) return;
            button.classList.toggle('visible', Boolean(deferredInstallPrompt) && !isPwaInstalled());
        }

        window.addEventListener('beforeinstallprompt', event => {
            event.preventDefault();
            deferredInstallPrompt = event;
            updateInstallButton();
        });

        window.addEventListener('appinstalled', () => {
            deferredInstallPrompt = null;
            updateInstallButton();
        });

        document.getElementById('installPwaButton').addEventListener('click', async () => {
            if (!deferredInstallPrompt) return;
            const promptEvent = deferredInstallPrompt;
            deferredInstallPrompt = null;
            await promptEvent.prompt();
            await promptEvent.userChoice;
            updateInstallButton();
        });

        if (window.location.protocol !== 'file:' && 'serviceWorker' in navigator) {
            let reloadedForUpdate = false;
            window.addEventListener('load', () => {
                navigator.serviceWorker.addEventListener('controllerchange', () => {
                    if (reloadedForUpdate) return;
                    reloadedForUpdate = true;
                    window.location.reload();
                });

                navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(registration => {
                    registration.update();

                    registration.addEventListener('updatefound', () => {
                        const worker = registration.installing;
                        if (!worker) return;
                        worker.addEventListener('statechange', () => {
                            if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                                worker.postMessage({ type: 'SKIP_WAITING' });
                            }
                        });
                    });

                    setInterval(() => registration.update(), 60 * 60 * 1000);
                }).catch(error => {
                    console.error('Service worker gagal didaftarkan:', error);
                });
            });
        }

        function updateSelectedDesaMarquee() {
            const label = document.getElementById('selectedDesaLabel');
            if (!label) return;
            label.classList.remove('marquee-active');
            label.style.removeProperty('--marquee-distance');
            if (label.scrollWidth <= label.clientWidth) return;
            label.style.setProperty('--marquee-distance', `${label.clientWidth - label.scrollWidth}px`);
            label.classList.add('marquee-active');
        }

        const selectedDesaLabel = document.getElementById('selectedDesaLabel');
        if (selectedDesaLabel) {
            new MutationObserver(updateSelectedDesaMarquee).observe(selectedDesaLabel, {
                childList: true,
                characterData: true,
                subtree: true
            });
            new ResizeObserver(updateSelectedDesaMarquee).observe(selectedDesaLabel.parentElement);
            updateSelectedDesaMarquee();
        }
    </script>
